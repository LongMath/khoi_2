<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Tập - CLB Toán Bác Long</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .transition-all { transition: all 0.3s ease; }
        /* Hiệu ứng xoay cho icon loading */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header -->
    <header class="bg-blue-700 text-white py-8 px-4 text-center shadow-lg relative">
        <h1 class="text-3xl font-bold mb-2">📚 HỆ THỐNG LUYỆN TẬP TOÁN TƯ DUY</h1>
        <p class="text-blue-200 text-lg">CLB Toán Bác Long — Kho đề IKMC Cấp độ 1</p>
        
        <!-- Trạng thái kết nối Google Sheets -->
        <div id="statusBadge" class="absolute top-4 right-4 bg-yellow-500 text-yellow-900 text-xs font-bold px-3 py-1 rounded-full flex items-center shadow">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-yellow-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Đang tải dữ liệu...
        </div>
    </header>

    <!-- Khu vực Nhập Tên Học Sinh -->
    <div id="selectionArea" class="max-w-3xl mx-auto mt-8 bg-white p-8 rounded-xl shadow-sm border border-gray-200 transition-all opacity-50 pointer-events-none">
        <h2 class="text-gray-700 font-bold mb-6 text-2xl text-center">👨‍🎓 Thông tin làm bài:</h2>
        
        <div class="flex flex-col md:flex-row gap-4 justify-center items-center mb-8">
            <input type="text" id="studentNameInput" placeholder="Nhập tên của con (VD: Linh Đan)..." class="w-full md:w-2/3 border-2 border-blue-300 rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 transition">
            
            <select id="questionCountSelect" class="w-full md:w-1/3 border-2 border-blue-300 rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 transition bg-white text-gray-700">
                <option value="3">Khởi động (3 câu)</option>
                <option value="5">Thử thách (5 câu)</option>
                <option value="10" selected>Olympic (10 câu)</option>
                <option value="24">Đề thi thật IKMC (24 câu)</option>
            </select>
        </div>

        <div class="text-center">
            <button id="startBtn" onclick="startTest()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold text-lg shadow-lg transition transform hover:scale-105 cursor-not-allowed" disabled>
                🚀 Bắt đầu làm bài
            </button>
            <div class="mt-6">
                <button onclick="resetAttempts()" class="text-sm text-gray-400 underline hover:text-red-500 transition">Xóa dữ liệu bộ đếm lịch sử</button>
            </div>
        </div>
    </div>

    <!-- Khu vực Hiển thị Câu hỏi -->
    <main id="questionContainer" class="max-w-4xl mx-auto mt-6 grid grid-cols-1 gap-6 hidden transition-all"></main>

    <!-- Khu vực Nút Nộp Bài -->
    <div id="submitArea" class="max-w-4xl mx-auto mt-8 text-center hidden transition-all">
        <button onclick="submitTest()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl font-bold text-lg shadow-lg transition transform hover:scale-105">
            Nộp bài & Xem kết quả
        </button>
    </div>

    <!-- Khu vực Kết quả & Nhận xét -->
    <div id="resultArea" class="max-w-4xl mx-auto mt-8 bg-white p-8 rounded-xl shadow-lg border border-green-200 hidden transition-all">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4 border-b pb-4">BẢNG KẾT QUẢ</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="text-lg text-center md:text-left"><span class="font-bold text-gray-600">Học sinh:</span> <span id="resStudentName" class="font-bold text-blue-600"></span></div>
            <div class="text-lg text-center"><span class="font-bold text-gray-600">Lần làm bài:</span> <span id="resAttemptCount" class="font-bold text-purple-600"></span></div>
            <div class="text-lg text-center md:text-right"><span class="font-bold text-gray-600">Điểm số:</span> <span id="resScore" class="font-bold text-red-600 text-2xl"></span></div>
        </div>
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 mb-6">
            <h3 class="font-bold text-blue-800 mb-2">👨‍🏫 Bác Long nhận xét:</h3>
            <p id="resComment" class="text-blue-900 italic text-lg leading-relaxed"></p>
        </div>
        <div id="resDetails" class="space-y-3"></div>
        
        <div class="mt-8 text-center">
            <button onclick="location.reload()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg font-bold shadow transition">
                Quay lại trang chủ
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ DỮ LIỆU -->
    <script>
        let onlineQuestionBank = [];
        let currentStudentName = "";
        let currentStudentKey = "";
        let currentQuestions = [];

        // =====================================================================
        // 1. URL GOOGLE SHEETS CSV (Dán link Publish to web định dạng CSV vào đây)
        // =====================================================================
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSf9FiwOPuyT2hRnDKblMLwE4465cTTDyvKLTeANk3l4cM2RSmud8BExl-O4PkUHU9cBGCB9sQ6B_xE/pub?output=csv";

        // Trình phân tích CSV nâng cao (xử lý tốt ngoặc kép và dấu phẩy trong nội dung)
        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        window.onload = async function() {
            const statusBadge = document.getElementById('statusBadge');
            const selectionArea = document.getElementById('selectionArea');
            const startBtn = document.getElementById('startBtn');

            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                if (!response.ok) throw new Error("Mạng lỗi hoặc sai link CSV");
                
                // Giải mã dữ liệu UTF-8 để không bị lỗi font tiếng Việt
                const buffer = await response.arrayBuffer();
                const decoder = new TextDecoder('utf-8');
                const csvText = decoder.decode(buffer);
                
                const rows = parseCSV(csvText).filter(row => row.join('').trim() !== '');
                if (rows.length < 2) throw new Error("File CSV trống hoặc chưa đúng định dạng");

                const headers = rows.shift(); // Lấy hàng đầu làm key (id, title, content, correctAnswer)

                onlineQuestionBank = rows.map(row => {
                    let obj = {};
                    headers.forEach((header, index) => {
                        obj[header.trim()] = row[index] ? row[index].trim() : '';
                    });
                    return obj;
                });

                // Cập nhật trạng thái thành công, mở khóa giao diện
                statusBadge.className = "absolute top-4 right-4 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow";
                statusBadge.innerHTML = `✅ Đã tải ${onlineQuestionBank.length} câu hỏi`;
                
                selectionArea.classList.remove('opacity-50', 'pointer-events-none');
                startBtn.removeAttribute('disabled');
                startBtn.classList.remove('cursor-not-allowed');

            } catch (error) {
                console.error(error);
                statusBadge.className = "absolute top-4 right-4 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow";
                statusBadge.innerHTML = `❌ Lỗi tải dữ liệu. Kiểm tra lại link!`;
            }
        };

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function getAttempts() {
            const data = localStorage.getItem('bac_long_attempts');
            return data ? JSON.parse(data) : {};
        }

        function saveAttempts(attemptsData) {
            localStorage.setItem('bac_long_attempts', JSON.stringify(attemptsData));
        }

        function resetAttempts() {
            if(confirm("Bác Long có chắc muốn xóa lịch sử số lần làm bài của các con không?")) {
                localStorage.removeItem('bac_long_attempts');
                alert("Đã xóa dữ liệu thành công!");
            }
        }

        function startTest() {
            const nameInput = document.getElementById('studentNameInput').value.trim();
            if (!nameInput) {
                alert("Vui lòng nhập tên của con để bắt đầu nhé!");
                return;
            }

            if (onlineQuestionBank.length === 0) {
                alert("Hệ thống chưa tải xong dữ liệu hoặc link bị lỗi. Vui lòng F5 tải lại trang.");
                return;
            }

            currentStudentName = nameInput;
            currentStudentKey = nameInput.toLowerCase().replace(/\s+/g, '_');
            const qCount = parseInt(document.getElementById('questionCountSelect').value);

            // Bốc ngẫu nhiên
            const shuffledBank = shuffleArray(onlineQuestionBank);
            const questionsToTake = Math.min(qCount, shuffledBank.length);
            currentQuestions = shuffledBank.slice(0, questionsToTake);

            document.getElementById('selectionArea').classList.add('hidden');
            const container = document.getElementById('questionContainer');
            container.innerHTML = ''; 

            currentQuestions.forEach((q, index) => {
                const safeId = q.id ? q.id : `q_${index}`;
                const safeTitle = q.title ? q.title : 'Câu hỏi tư duy';
                const safeContent = q.content ? q.content : 'Nội dung đang cập nhật...';

                const card = `
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded-md text-sm">Câu ${index + 1}</span>
                            <span class="text-sm text-gray-400 font-medium">${safeTitle}</span>
                        </div>
                        <p class="text-gray-800 leading-relaxed text-lg mb-6">${safeContent}</p>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex items-center">
                            <label class="font-bold text-gray-700 mr-3">Đáp án:</label>
                            <input type="text" id="ans_${safeId}" class="w-full md:w-48 border-b-2 border-blue-500 bg-transparent px-2 py-1 text-lg font-bold text-center focus:outline-none focus:bg-white transition" placeholder="Nhập đáp án...">
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            container.classList.remove('hidden');
            document.getElementById('submitArea').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function submitTest() {
            if (!confirm("Con đã hoàn thành và muốn nộp bài chưa?")) return;

            const attemptsData = getAttempts();
            const newAttemptCount = (attemptsData[currentStudentKey] || 0) + 1;
            attemptsData[currentStudentKey] = newAttemptCount;
            saveAttempts(attemptsData);

            let correctCount = 0;
            const totalQs = currentQuestions.length;
            let detailsHTML = '';

            currentQuestions.forEach((q, index) => {
                const safeId = q.id ? q.id : `q_${index}`;
                const studentAns = document.getElementById(`ans_${safeId}`).value.trim();
                
                // So sánh an toàn (đưa về chữ thường để tránh lỗi khi người dùng gõ hoa/thường)
                const isCorrect = (studentAns.toLowerCase() === String(q.correctAnswer).trim().toLowerCase());

                if (isCorrect) correctCount++;

                detailsHTML += `
                    <div class="p-4 rounded-xl mb-3 ${isCorrect ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}">
                        <span class="font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">Câu ${index + 1}: ${isCorrect ? '✅ CHÍNH XÁC' : '❌ CHƯA CHÍNH XÁC'}</span>
                        ${!isCorrect ? `<div class="mt-2 text-gray-700"><span class="mr-4">Con chọn: <b class="text-red-600">${studentAns || '(Để trống)'}</b></span> | <span>Đáp án chuẩn: <b class="text-green-600">${q.correctAnswer}</b></span></div>` : ''}
                    </div>
                `;
            });

            const scorePercent = (correctCount / totalQs) * 100;
            
            let comment = "";
            if (scorePercent === 100) {
                comment = "Quá tuyệt vời! Con nắm kiến thức cực kỳ vững chắc. Hãy tiếp tục phát huy phong độ này ở các bài thi tới nhé!";
            } else if (scorePercent >= 75) {
                comment = "Con làm rất tốt! Tuy nhiên vẫn còn một chút bất cẩn nhỏ. Con xem lại câu làm sai để rút kinh nghiệm nhé.";
            } else if (scorePercent >= 50) {
                comment = "Con đã rất nỗ lực hoàn thành bài. Có vẻ áp lực thời gian làm khó con. Bác cháu ta sẽ ôn tập lại phần này nhé!";
            } else {
                comment = "Bài làm hôm nay chưa được như ý, nhưng không sao cả! Ở buổi học tới, Bác Long sẽ hướng dẫn lại con phương pháp suy luận.";
            }

            document.getElementById('resStudentName').innerText = currentStudentName;
            document.getElementById('resAttemptCount').innerText = `Thứ ${newAttemptCount}`;
            document.getElementById('resScore').innerText = `${correctCount}/${totalQs} (${scorePercent.toFixed(0)}%)`;
            document.getElementById('resComment').innerText = comment;
            document.getElementById('resDetails').innerHTML = detailsHTML;

            document.getElementById('submitArea').classList.add('hidden');
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
